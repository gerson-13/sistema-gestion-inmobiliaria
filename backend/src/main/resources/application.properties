# =============================================================================
# CONFIGURACIÓN DEL SERVIDOR
# =============================================================================
server.port=${SERVER_PORT:8080}

# =============================================================================
# CONFIGURACIÓN DE CONEXIÓN MYSQL (Sin credenciales sensibles expuestas)
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inmobiliaria_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del pool de conexiones HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# =============================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# =============================================================================
# Modo estricto: valida el esquema preexistente sin recrear ni alterar tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
